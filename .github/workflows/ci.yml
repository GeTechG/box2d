name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  commit-kinds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Self-test of the check
        run: bash .github/scripts/check-commit-kinds-test.sh
      - name: Commits do not mix code and infrastructure
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" != 0000000000000000000000000000000000000000 ]; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="${{ github.sha }}^..${{ github.sha }}"
          fi
          bash .github/scripts/check-commit-kinds.sh "$range"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the pinned compiler, then types every module with it on the three targets.
      - name: Set up the toolchain and type the library
        run: tools/setup.sh
      - name: Type on every target
        run: |
          for t in "--interp" "-hl /dev/null" "-js /dev/null"; do
            HAXE_STD_PATH=.haxe/std .haxe/haxe -cp . --macro "include('box2D')" --no-output $t
          done
      - name: Run the tests
        run: bash test/run.sh
